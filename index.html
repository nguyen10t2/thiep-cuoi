<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiệp Cưới — Nhài & Long</title>
  <meta name="description" content="Trân trọng kính mời Quý vị đến chung vui cùng gia đình trong lễ thành hôn của Đào Thị Nhài & Bùi Văn Long.">
  <meta property="og:title" content="Thiệp Cưới — Nhài & Long">
  <meta property="og:description" content="19/07/2026 — Trân trọng kính mời Quý vị đến chung vui cùng gia đình.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/image/MainImage.jpg">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cormorant Garamond', serif;
      min-height: 100vh;
      background: linear-gradient(145deg, #ffffff 0%, #f9f9f9 40%, #f0f0f0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    .subtitle {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #555555;
      margin-bottom: 1rem;
    }
    .names {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(3rem, 12vw, 5rem);
      color: #222222;
      line-height: 1.1;
      margin-bottom: 0.3rem;
    }
    .amp {
      font-size: 0.5em;
      color: #777777;
    }
    .date {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.5em;
      color: #444444;
      margin-bottom: 2.5rem;
    }
    .divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(to right, transparent, #888888, transparent);
      margin: 0 auto 2rem;
    }
    .label {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #777777;
      margin-bottom: 1.2rem;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }
    .btn {
      display: block;
      width: 100%;
      max-width: 300px;
      padding: 1rem 2rem;
      border-radius: 50px;
      text-decoration: none;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: all 0.3s;
      border: 2px solid #333333;
    }
    .btn-bride {
      background: #333333;
      color: #ffffff;
    }
    .btn-bride:hover {
      background: #111111;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .btn-groom {
      background: transparent;
      color: #333333;
    }
    .btn-groom:hover {
      background: #333333;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .hint {
      font-size: 0.75rem;
      color: #777777;
      margin-top: 2rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="subtitle">Thiệp Mời Cưới</p>
    <h1 class="names">Nhài <span class="amp">&</span> Long</h1>
    <p class="date">19 . 07 . 2026</p>
    <div class="divider"></div>
    <p class="label">Chọn thiệp theo gia đình</p>
    <div class="btn-group">
      <a href="nha-gai/" class="btn btn-bride">Nhà Gái — Họ Đào</a>
      <a href="nha-trai/" class="btn btn-groom">Nhà Trai — Họ Bùi</a>
    </div>
    <p class="hint">Vuốt xuống để xem thiệp sau khi chọn</p>
  </div>
</body>
</html>
